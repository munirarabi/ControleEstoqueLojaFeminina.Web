<div class="card flex justify-content-center">
  <p-dialog
    header="Adicionar novo produto"
    [(visible)]="visible"
    [style]="{ width: '20rem' }"
  >
    <div class="flex align-items-center gap-3 mb-3">
      <label for="categoria" class="font-semibold w-6rem">Categoria</label>
      <div class="card flex justify-content-center">
        <p-dropdown
          [options]="lstCategories"
          [(ngModel)]="selectedCategory"
          optionLabel="name"
          placeholder="Selecione uma categoria"
        />
      </div>
    </div>
    <div class="flex align-items-center gap-3 mb-5">
      <label for="valor" class="font-semibold w-6rem">Valor</label>
      <p-inputNumber
        [(ngModel)]="value1"
        inputId="currency-us"
        mode="currency"
        currency="USD"
        locale="en-US"
      />
    </div>
    <div class="flex justify-content-end gap-2">
      <p-button
        label="Cancel"
        severity="secondary"
        (onClick)="visible = false"
      />
      <p-button label="Save" (onClick)="visible = false" />
    </div>
  </p-dialog>
</div>

<div class="card flex justify-content-center gap-2">
  <p-toast />
</div>
